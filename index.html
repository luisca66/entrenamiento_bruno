<body><main id="app" class="app"></main><input id="importFile" type="file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status"></div>
<script>
const STORAGE_KEY='workoutSessions', LBS_TO_KG=.453592;
// Ejercicios de AppPesas (bloque generado por Argon/Gemini)
const EXERCISES={
  'Sentadilla':{rom:.57,barWeight:20,usesBodyweight:false,fiveRM:40,unit:'kg'},
  'Peso Muerto':{rom:.46,barWeight:20,usesBodyweight:false,fiveRM:95,unit:'kg'},
  'Pantorrilla':{rom:.2,barWeight:20,usesBodyweight:false,fiveRM:180,unit:'kg'},
  'Pull Ups':{rom:.5,barWeight:0,usesBodyweight:true,fiveRM:0,unit:'kg'},
  'Remo con Barra':{rom:.36,barWeight:12.5,usesBodyweight:false,fiveRM:117.5,unit:'kg'},
  'Shrugs':{rom:.15,barWeight:20,usesBodyweight:false,fiveRM:0,unit:'kg'},
  'Fondos':{rom:.4,barWeight:0,usesBodyweight:true,fiveRM:0,unit:'kg'},
  'Press Hombro Mancuerna':{rom:.4,barWeight:0,usesBodyweight:false,fiveRM:55.1,unit:'lbs'},
  'Press Inclinado Mancuerna':{rom:.42,barWeight:0,usesBodyweight:false,fiveRM:169.8,unit:'lbs'},
  'Press Horizontal Barra':{rom:.4,barWeight:20,usesBodyweight:false,fiveRM:90,unit:'kg'}
};
const cfgFrom=c=>({...c});
const ASSISTED=[];
let screen='session',exerciseIndex=0,parametersOpen=false,touchStartX=0,timer={seconds:0,running:false,endAt:0,duration:90},timerInterval=null,currentSession=null;
const app=document.getElementById('app'), importFile=document.getElementById('importFile');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const kg=(value,unit)=>unit==='lbs'?Number(value||0)*LBS_TO_KG:Number(value||0);
const fmt=n=>Math.round(Number(n)||0).toLocaleString('es-MX');
const CYCLES_KEY=STORAGE_KEY+'Cycles', SCHEMA_VERSION=2;
function readArray(key){
 const raw=localStorage.getItem(key),value=JSON.parse(raw===null?'[]':raw);
 if(!Array.isArray(value))throw Error('Datos inválidos en '+key);
 if(key===STORAGE_KEY)for(const s of value){
  if(!s||!validDate(s.date)||!Array.isArray(s.exercises))throw Error('Sesión inválida');
  for(const e of s.exercises){if(!e||typeof e.name!=='string'||!Array.isArray(e.sets))throw Error('Ejercicio inválido');
   for(const x of e.sets)if(!x||!['sets','reps','weight'].every(k=>Number.isFinite(Number(x[k]))))throw Error('Serie inválida');
  }
 }
 return value
}
const sessions=()=>readArray(STORAGE_KEY), cycles=()=>readArray(CYCLES_KEY);
function backupData(key=STORAGE_KEY+'_respaldo_v2'){if(localStorage.getItem(key)===null)localStorage.setItem(key,JSON.stringify({schemaVersion:SCHEMA_VERSION,sessions:sessions(),cycles:cycles(),rawSessions:localStorage.getItem(STORAGE_KEY),rawCycles:localStorage.getItem(CYCLES_KEY)}))}
function migrate(){const all=sessions();if(all.some(s=>s.summary?.calculationVersion!=='2.0')){backupData();localStorage.setItem(STORAGE_KEY,JSON.stringify(all.map(normalize)))}}
function writeCollections(ss,cc){const oldS=localStorage.getItem(STORAGE_KEY),oldC=localStorage.getItem(CYCLES_KEY);try{localStorage.setItem(CYCLES_KEY,JSON.stringify(cc));localStorage.setItem(STORAGE_KEY,JSON.stringify(ss))}catch(e){if(oldC===null)localStorage.removeItem(CYCLES_KEY);else localStorage.setItem(CYCLES_KEY,oldC);if(oldS===null)localStorage.removeItem(STORAGE_KEY);else localStorage.setItem(STORAGE_KEY,oldS);throw e}}

function blankSession(date=today()){return{date,bodyweight:79.2,workoutTime:60,exercises:Object.keys(EXERCISES).map(name=>({name,sets:[]})),exerciseConfigs:Object.fromEntries(Object.entries(EXERCISES).map(([name,c])=>[name,cfgFrom(c)]))}}
function normalize(s){
 const fresh={...blankSession(s.date||today()),...s};
 fresh.exerciseConfigs={...fresh.exerciseConfigs};fresh.exercises=(s.exercises||[]).map(ex=>({...ex,sets:(ex.sets||[]).map(x=>({...x}))}));
 for(const [name,base] of Object.entries(EXERCISES)){if(!fresh.exercises.some(e=>e.name===name))fresh.exercises.push({name,sets:[]});fresh.exerciseConfigs[name]={...cfgFrom(base),...s.exerciseConfigs?.[name]}}
 for(const ex of fresh.exercises)if(!fresh.exerciseConfigs[ex.name])fresh.exerciseConfigs[ex.name]={fiveRM:0,rom:0,unit:'kg',usesBodyweight:false};
 fresh.id=s.id||'session-'+fresh.date;fresh.summary=buildSummary(fresh);return fresh
}
function load(date=today()){if(!date)return;const found=sessions().find(s=>s.date===date);currentSession=found?normalize(found):normalize(blankSession(date));render()}

function weekComparison(c,w){const actual=sessions().filter(s=>s.cycleId===c.id&&s.cycleWeek===w.week&&trained(s)).map(normalize),plan=w.workouts.map(workout=>{const snap=actual.find(s=>s.plannedWorkoutId===workout.id)?.planSnapshot;return buildSummary(plannedSession(c,workout,snap))});return{actual:aggregate(actual.map(s=>{const refs=s.planSnapshot?.references||c.references,comparison=clone(s);for(const ex of comparison.exercises){const ref=refs[ex.name],cfg=comparison.exerciseConfigs[ex.name];if(ref)cfg.fiveRM=kg(ref.fiveRM,ref.unit)/(cfg.unit==='lbs'?LBS_TO_KG:1)}return buildSummary(comparison)})),planned:aggregate(plan)}}
function comparisonTable(c){return c.weeklyPlan.map(w=>{const {actual:a,planned:p}=weekComparison(c,w),ratio=(x,y)=>y?(x/y*100).toFixed(0)+'%':'Sin dato',difference=a.meanRelativeIntensityPct===null||p.meanRelativeIntensityPct===null?'Sin dato':(a.meanRelativeIntensityPct-p.meanRelativeIntensityPct).toFixed(1)+' pp';return `<details class="metrics cycle-card"><summary>Semana ${w.week} · ${a.sessions}/${p.sessions} sesiones</summary><div class="week-comparison"><table><tr><th>Métrica</th><th>Planeado</th><th>Real</th><th>Cumplimiento</th></tr>${[['Series',p.totalSets,a.totalSets,'—'],['Reps',p.totalReps,a.totalReps,ratio(a.totalReps,p.totalReps)],['Volumen',fmt(p.volumeLoadKgReps),fmt(a.volumeLoadKgReps),ratio(a.volumeLoadKgReps,p.volumeLoadKgReps)],['Intensidad',intensityText(p.meanRelativeIntensityPct,p.intensityCoveragePctReps),intensityText(a.meanRelativeIntensityPct,a.intensityCoveragePctReps),difference]].map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</table></div></details>`}).join('')}
function renderCycles(){app.innerHTML=`<section class="screen cycle-editor"><header class="sheet-title"><h1>Ciclos</h1><button class="ghost" onclick="go('session')">Cerrar</button></header>${cycleDraft?cycleForm():`<button class="primary" onclick="newCycle()">Crear ciclo</button><p class="hint">Un solo ciclo activo. El plan avanza por entrenamientos registrados. Importar agrega fechas nuevas y conserva las existentes.</p>${cycles().map(c=>`<section class="metrics cycle-card"><h2>${esc(c.name)}</h2><p>${{pavel_linear:'Lineal Pavel',pavel_step:'Escalonado Pavel',free:'Libre'}[c.type]} · ${c.startDate} · ${c.weeks} semanas · ${c.sessionsPerWeek}/semana · ${{active:'Activo',paused:'Pausado',planned:'Planeado'}[c.status]||esc(c.status)}</p><div class="split"><button class="secondary" onclick="editCycle(${jsArg(c.id)})">Editar</button><button class="secondary" onclick="${c.status==='active'?'pauseCycle':'activateCycle'}(${jsArg(c.id)})">${c.status==='active'?'Pausar':'Activar'}</button></div></section>${comparisonTable(c)}`).join('')}`}</section>`}
function cycleInput(label,key,type='text'){return `<label class="field">${label}<input type="${type}" value="${esc(cycleDraft[key])}" onchange="cycleField('${key}',this.value)"></label>`}
function cycleForm(){const c=cycleDraft;return `${cycleInput('Nombre','name')}<label class="field">Tipo<select onchange="cycleField('type',this.value)">${[['pavel_linear','Lineal Pavel'],['pavel_step','Escalonado Pavel'],['free','Libre']].map(([k,v])=>`<option value="${k}" ${c.type===k?'selected':''}>${v}</option>`).join('')}</select></label>${cycleInput('Fecha de inicio','startDate','date')}<div class="split">${cycleInput('Semanas (1–52)','weeks','number')}${cycleInput('Entrenamientos/semana (1–7)','sessionsPerWeek','number')}</div><p class="hint">Cargas en kg externos (lastre en ejercicios corporales). 5RM histórico fijado al crear el ciclo. El incremento se aplica por entrenamiento; Escalonado mantiene cada carga N entrenamientos. Libre repite la base para editarla abajo.</p>${Object.keys(EXERCISES).map((name,i)=>{const p=c.progression[name];return `<section class="metrics cycle-card"><label class="check-ex"><input type="checkbox" ${p?'checked':''} onchange="selectCycleExercise('${name}',this.checked)">${esc(name)}</label>${p?`<div class="split">${[['initialTopKg','Carga inicial kg'],['incrementKg','Incremento kg'],['backoffRatio','Ratio segunda serie'],['repeatWorkouts','Repetir carga N entrenamientos'],['reps','Reps por serie'],['series','Series por entrenamiento']].map(([k,label])=>`<label class="field">${label}<input type="number" step="any" value="${p[k]}" onchange="progressionField('${name}','${k}',this.value)"></label>`).join('')}</div>`:''}</section>`}).join('')}<button class="secondary" style="width:100%" onclick="generateDraft()">Generar / regenerar plan</button><p class="hint">Tras cambiar tipo, ejercicios, semanas o frecuencia, regenera el plan. Después puedes editar cada grupo de cada entrenamiento.</p>${c.weeklyPlan.map((w,wi)=>`<details><summary>Semana ${w.week} · editar plan</summary>${w.workouts.map((work,ti)=>`<section class="metrics cycle-card"><span class="section-title">Entrenamiento ${ti+1}</span>${work.exercises.map((ex,ei)=>`<p>${esc(ex.exerciseId)}</p><div class="sets-head" style="display:flex;justify-content:space-around"><span>SERIES</span><span>REPS</span><span>KG EXTERNOS</span></div>${ex.sets.map((s,si)=>`<div class="plan-group">${[['count',s.count],['reps',s.reps],['loadKg',s.loadKg]].map(([key,v])=>`<input class="set-input" aria-label="${key==='count'?'Series':key==='reps'?'Repeticiones':'Carga kg'}" type="number" step="any" value="${v}" onchange="cycleDraft.weeklyPlan[${wi}].workouts[${ti}].exercises[${ei}].sets[${si}]['${key}']=Number(this.value)">`).join('')}<button class="remove" aria-label="Quitar grupo" onclick="cycleDraft.weeklyPlan[${wi}].workouts[${ti}].exercises[${ei}].sets.splice(${si},1);renderCycles()">×</button></div>`).join('')}<button class="ghost" onclick="cycleDraft.weeklyPlan[${wi}].workouts[${ti}].exercises[${ei}].sets.push({count:1,reps:5,loadKg:0});renderCycles()">+ Grupo de series</button>`).join('')}</section>`).join('')}</details>`).join('')}<div class="split"><button class="secondary" onclick="cycleDraft=null;renderCycles()">Cancelar</button><button class="primary" onclick="saveCycle()">Guardar ciclo</button></div>`}

timer.duration=Number(localStorage.getItem('workoutRestBruno'))||90;setInterval(()=>save(false),30000);try{migrate();load()}catch(e){app.innerHTML='<section class="screen"><h1>Datos protegidos</h1><p>No se pudo leer o migrar el historial. No se sobrescribió el registro original. Libera espacio y vuelve a abrir la app.</p></section>'}
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;window.location.reload()});try{const registration=await navigator.serviceWorker.register('./sw.js?v=7');await registration.update()}catch{}});
</script></body></html>
