<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0B0C0E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <title>Entrenamiento Bruno</title>
  <style>
    :root{--bg:#0B0C0E;--foot:#0E0F12;--surface:#111317;--surface2:#15171B;--text:#F2F3F5;--text2:#B9BFC7;--text3:#8A8F98;--muted:#7A8089;--muted2:#6E747D;--muted3:#4A4F57;--volt:#A78BFA;--signal:#FF5A1F;--line:rgba(255,255,255,.07);--border:rgba(255,255,255,.09)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Barlow,-apple-system,BlinkMacSystemFont,sans-serif}
    body{min-height:100dvh} button,input{font:inherit}button{cursor:pointer}button:active{transform:scale(.97)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
    .app{width:100%;max-width:620px;min-height:100dvh;margin:auto;background:var(--bg)}
    .screen{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 108px)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 18px}
    .kicker,.section-title,.micro{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
    .kicker{font-size:12px}.screen-title{margin:4px 0 0;font:700 34px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
    .nav-actions{display:flex;gap:7px}.ghost{min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.05);color:var(--text2);font:600 12px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase}
    .date-control{position:relative;display:inline-block}.date-control input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
    .hero{position:relative;overflow:hidden;margin:0 0 8px;padding:22px 20px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}
    .hero:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--volt)}
    .hero-number{margin:10px 0 16px;font:700 66px/.9 'Barlow Condensed';letter-spacing:-.02em;color:var(--volt);font-variant-numeric:tabular-nums}.hero-number small{font-size:20px;color:var(--muted);letter-spacing:0}
    .compare{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:8px;margin:8px 0;font:600 11px 'Barlow Condensed';letter-spacing:.14em}.track{height:10px;overflow:hidden;border-radius:2px;background:rgba(255,255,255,.06)}.fill{height:100%;background:var(--volt)}.fill.prev{background:#454A52}.previous-value{font:600 12px Barlow;color:var(--muted)}
    .hero-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--text2)}.delta{font:700 15px 'Barlow Condensed';color:var(--volt)}
    .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 22px}.mini{padding:13px 12px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:var(--surface)}.mini b{display:block;margin-top:4px;font:700 26px/1.05 'Barlow Condensed';font-variant-numeric:tabular-nums}.mini small{color:var(--muted2)}
    .plan-head{display:flex;justify-content:space-between;margin:0 4px 9px}.section-title{font-size:13px}.segments{display:flex;gap:4px;margin:0 4px 12px}.segment{flex:1;height:5px;border-radius:1px;background:rgba(255,255,255,.09)}.segment.done,.segment.current{background:var(--volt)}
    .exercise-list{display:grid;gap:8px}.exercise-row{display:flex;align-items:center;gap:13px;width:100%;min-height:66px;padding:13px 15px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:var(--surface);color:var(--text);text-align:left}.index{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:rgba(255,255,255,.06);color:var(--muted2);font:700 15px 'Barlow Condensed'}.exercise-row.done .index{background:var(--volt);color:var(--bg)}.row-copy{min-width:0;flex:1}.row-name{display:block;font:600 19px/1.1 'Barlow Condensed';text-transform:uppercase}.row-sub{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.badge{padding:4px 7px;border-radius:5px;background:var(--signal);color:var(--bg);font:700 10px 'Barlow Condensed';letter-spacing:.14em}.chev{color:var(--muted3);font:600 18px 'Barlow Condensed'}
    .sticky-cta{position:fixed;z-index:8;left:50%;bottom:0;width:min(620px,100%);transform:translateX(-50%);padding:28px 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(180deg,rgba(11,12,14,0),var(--bg) 36%)}.primary{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--volt);color:var(--bg);font:700 19px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}
    .train-screen{padding-bottom:calc(env(safe-area-inset-bottom) + 190px)}.train-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.train-top .segments{margin:0}.position{font:700 15px 'Barlow Condensed';color:var(--muted)}
    .exercise-heading{display:flex;align-items:flex-start;gap:10px;margin:8px 4px 10px}.exercise-heading h1{flex:1;margin:0;font:700 40px/.95 'Barlow Condensed';letter-spacing:-.01em;text-transform:uppercase}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 14px}.chip{min-height:30px;padding:5px 9px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.05);color:var(--text2);font:600 11px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase}.chip.unit.active{border-color:rgba(167,139,250,.45);color:var(--volt)}
    .assist{margin:0 4px 16px;padding-left:10px;border-left:2px solid var(--signal);color:var(--text3);font-size:12.5px;line-height:1.45}.sets-head,.set-row{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr)) 34px;gap:7px;align-items:center}.sets-head{margin-bottom:7px}.sets-head span{text-align:center;font:600 10px 'Barlow Condensed';letter-spacing:.14em;color:var(--muted2)}.set-row{margin-bottom:8px}.set-n{text-align:center;font:700 15px 'Barlow Condensed';color:var(--muted2)}.set-input{width:100%;min-width:0;min-height:48px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text);font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}.set-input.weight{border-color:rgba(167,139,250,.28);color:var(--volt);font-weight:700}.remove{min-height:44px;border:0;background:none;color:var(--muted3);font-size:22px}.empty{padding:22px;text-align:center;color:var(--muted2);font-size:13px}.set-actions{display:flex;gap:8px;margin:12px 0}.set-actions button{flex:1;min-height:48px;border-radius:12px;font:700 14px 'Barlow Condensed';letter-spacing:.1em}.add{border:1.5px dashed rgba(167,139,250,.4);background:none;color:var(--volt)}.repeat{border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text2)}
    .metrics{padding:16px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:var(--surface)}.metric-head{display:flex;justify-content:space-between}.metric-head b{font:700 22px 'Barlow Condensed'}.intensity-track{height:8px;margin:10px 0 15px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric-grid b{display:block;margin-top:3px;font:700 19px 'Barlow Condensed'}.parameters{margin-top:10px}.parameters>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:none;color:var(--text3);font:600 13px 'Barlow Condensed';letter-spacing:.14em}.param-panel{padding:8px 14px 2px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}.param-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.param-row:last-child{border:0}.param-copy b{font:700 14px 'Barlow Condensed';letter-spacing:.06em}.param-copy small{display:block;color:var(--muted2)}.param-input{width:86px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:16px;text-align:center}.param-input.rom-edit{border-color:rgba(167,139,250,.42);color:var(--volt);font-weight:700}.one-rm{font:700 20px 'Barlow Condensed';color:var(--volt)}
    .train-footer{position:fixed;z-index:9;left:50%;bottom:0;width:min(620px,100%);transform:translateX(-50%);padding:11px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:var(--foot)}.timer-off{width:100%;min-height:48px;margin-bottom:10px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.05);color:var(--text2);font:700 14px 'Barlow Condensed';letter-spacing:.12em}.timer-on{display:flex;align-items:center;gap:10px;min-height:58px;margin-bottom:10px;padding:8px 12px;border:1px solid rgba(167,139,250,.25);border-radius:13px;background:var(--surface2)}.timer-label{flex:1;font:700 30px 'Barlow Condensed';color:var(--volt)}.timer-on button{min-height:44px;border:0;border-radius:9px;background:rgba(167,139,250,.14);color:var(--volt);font:700 13px 'Barlow Condensed'}.timer-on .finish{background:none;color:var(--muted2)}.train-nav{display:flex;gap:8px}.prev-btn{width:74px;min-height:56px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.05);color:var(--text2);font-size:20px}
    .sheet-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheet-title h1{margin:0;font:700 34px 'Barlow Condensed';text-transform:uppercase}.session-list{display:grid;gap:8px}.history-card{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:15px 12px 15px 16px;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:var(--surface)}.history-open{border:0;background:none;color:var(--text);text-align:left}.history-open b{font:600 18px 'Barlow Condensed';text-transform:uppercase}.history-open small{display:block;color:var(--muted)}.history-volume{text-align:right;font:700 22px 'Barlow Condensed';color:var(--volt)}.history-volume small{display:block;font-size:10px;color:var(--muted2);letter-spacing:.14em}.delete{width:44px;height:44px;border:0;background:none;color:var(--muted3);font-size:20px}.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
    .settings-card{border:1px solid rgba(255,255,255,.06);border-radius:14px;background:var(--surface);padding:0 16px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-copy b{font:700 15px 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase}.setting-copy small{display:block;margin-top:3px;color:var(--muted2)}.setting-input{width:96px;min-height:48px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text);font-size:17px;text-align:center}.settings-actions{display:grid;gap:9px;margin-top:16px}.secondary{min-height:52px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.05);color:var(--text);font:700 15px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.credit{margin-top:36px;text-align:center;color:#5B6068;font-size:12px}.credit a{color:var(--text3)}
    .toast{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:#24272D;color:var(--text);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:380px){.hero-number{font-size:58px}.sets-head,.set-row{grid-template-columns:28px repeat(3,minmax(0,1fr)) 30px;gap:4px}.set-input{font-size:16px}.exercise-heading h1{font-size:36px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>

<body><main id="app" class="app"></main><input id="importFile" type="file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status"></div>
<script>
const STORAGE_KEY='workoutSessions', LBS_TO_KG=.453592;
const EXERCISES={
  'Sentadilla':{rom:.57,barWeight:20,usesBodyweight:false,fiveRM:40,unit:'kg'},
  'Peso Muerto':{rom:.46,barWeight:20,usesBodyweight:false,fiveRM:95,unit:'kg'},
  'Pantorrilla':{rom:.2,barWeight:20,usesBodyweight:false,fiveRM:180,unit:'kg'},
  'Pull Ups':{rom:.5,barWeight:0,usesBodyweight:true,fiveRM:0,unit:'kg'},
  'Remo con Barra':{rom:.36,barWeight:12.5,usesBodyweight:false,fiveRM:117.5,unit:'kg'},
  'Shrugs':{rom:.15,barWeight:20,usesBodyweight:false,fiveRM:0,unit:'kg'},
  'Fondos':{rom:.4,barWeight:0,usesBodyweight:true,fiveRM:0,unit:'kg'},
  'Press Hombro Mancuerna':{rom:.4,barWeight:0,usesBodyweight:false,fiveRM:55.1,unit:'lbs'},
  'Press Inclinado Mancuerna':{rom:.42,barWeight:0,usesBodyweight:false,fiveRM:169.8,unit:'lbs'},
  'Press Horizontal Barra':{rom:.4,barWeight:20,usesBodyweight:false,fiveRM:90,unit:'kg'}
};
const ASSISTED=[];
let screen='session',exerciseIndex=0,parametersOpen=false,touchStartX=0,timer={seconds:0,running:false,endAt:0,duration:90},timerInterval=null,currentSession=null;
const app=document.getElementById('app'), importFile=document.getElementById('importFile');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const kg=(value,unit)=>unit==='lbs'?Number(value||0)*LBS_TO_KG:Number(value||0);
const fmt=n=>Math.round(Number(n)||0).toLocaleString('es-MX');
const sessions=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return []}};
function blankSession(date=today()){return{date,bodyweight:79.2,workoutTime:60,exercises:Object.keys(EXERCISES).map(name=>({name,sets:[]})),exerciseConfigs:Object.fromEntries(Object.entries(EXERCISES).map(([name,c])=>[name,{fiveRM:c.fiveRM,rom:c.rom,unit:c.unit}]))}}
function normalize(s){const fresh=blankSession(s.date||today());fresh.bodyweight=Number(s.bodyweight)||79.2;fresh.workoutTime=Number(s.workoutTime)||60;for(const ex of fresh.exercises){const old=(s.exercises||[]).find(x=>x.name===ex.name);if(old)ex.sets=(old.sets||[]).map(x=>({sets:Number(x.sets)||0,reps:Number(x.reps)||0,weight:Number(x.weight)||0}));const c=s.exerciseConfigs?.[ex.name];if(c)fresh.exerciseConfigs[ex.name]={fiveRM:Number(c.fiveRM)||0,rom:Number(c.rom)||EXERCISES[ex.name].rom,unit:c.unit==='lbs'?'lbs':'kg'}}return fresh}
function load(date=today()){const found=sessions().find(s=>s.date===date);currentSession=found?normalize(found):blankSession(date);save(false);render()}
function save(show=false){if(!currentSession)return;const all=sessions(),i=all.findIndex(s=>s.date===currentSession.date);if(i>=0)all[i]=currentSession;else all.push(currentSession);all.sort((a,b)=>b.date.localeCompare(a.date));localStorage.setItem(STORAGE_KEY,JSON.stringify(all));if(show)toast('Entrenamiento guardado')}
function exStats(ex,session=currentSession){const c=session.exerciseConfigs[ex.name]||EXERCISES[ex.name],base=EXERCISES[ex.name],body=Number(session.bodyweight)||79.2;let volume=0,force=0,work=0,maxTotalWeight=0,totalReps=0,totalSets=0;for(const set of ex.sets||[]){const setCount=Number(set.sets)||0,reps=Number(set.reps)||0,w=Number(set.weight)||0;if(setCount>0&&reps>0&&(base.usesBodyweight||w>0)){const wkg=kg(w,c.unit),total=base.usesBodyweight?wkg+body:wkg+(base.barWeight||0),f=total*9.8*setCount*reps;volume+=(base.usesBodyweight?total:wkg)*setCount*reps;force+=f;work+=f*c.rom;maxTotalWeight=Math.max(maxTotalWeight,total);totalReps+=setCount*reps;totalSets+=setCount}}const oneRM=kg(c.fiveRM,c.unit)>0?kg(c.fiveRM,c.unit)/(1.0278-.0278*5):0;return{volume,force,work,maxTotalWeight,totalReps,totalSets,oneRM,intensity:oneRM>0?maxTotalWeight/oneRM*100:0}}
function totals(session=currentSession){let volume=0,work=0,sum=0,count=0;for(const ex of session.exercises){const s=exStats(ex,session);volume+=s.volume;work+=s.work;if(s.intensity>0){sum+=s.intensity;count++}}return{volume,work,watts:session.workoutTime>0?work/(session.workoutTime*60):0,intensity:count?sum/count:0}}
function previousSession(){return sessions().filter(s=>s.date<currentSession.date).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function historicalMax(name,date=currentSession.date){let max=0;for(const raw of sessions()){if(raw.date>=date)continue;const s=normalize(raw),ex=s.exercises.find(x=>x.name===name);if(ex)max=Math.max(max,exStats(ex,s).maxTotalWeight)}return max}
function isPR(ex,session=currentSession){const value=exStats(ex,session).maxTotalWeight;return value>0&&value>historicalMax(ex.name,session.date)+.5}
function done(ex){return (ex.sets||[]).some(s=>Number(s.sets)>0&&Number(s.reps)>0&&(EXERCISES[ex.name].usesBodyweight||Number(s.weight)>0))}
function dateLabel(date){return new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z')).replace(/\./g,'').toUpperCase()}
function segments(current=-1){return currentSession.exercises.map((ex,i)=>`<i class="segment ${current===i?'current':done(ex)?'done':''}"></i>`).join('')}
function equipment(name){if(EXERCISES[name].usesBodyweight)return'PESO CORPORAL';if(name.includes('Mancuerna'))return'MANCUERNAS';return'BARRA Y DISCOS'}
function go(next,index=exerciseIndex){screen=next;exerciseIndex=index;parametersOpen=false;window.scrollTo(0,0);render()}
function render(){if(screen==='session')renderSession();else if(screen==='train')renderTrain();else if(screen==='history')renderHistory();else renderSettings()}
function renderSession(){const t=totals(),prev=previousSession(),pt=prev?totals(normalize(prev)):{volume:0},max=Math.max(t.volume,pt.volume,1),delta=pt.volume?(t.volume-pt.volume)/pt.volume*100:0,complete=currentSession.exercises.filter(done).length,sessionNo=sessions().filter(s=>s.date<=currentSession.date).length;app.innerHTML=`<section class="screen"><header class="top"><div><label class="date-control"><span class="kicker">${dateLabel(currentSession.date)}</span><input type="date" value="${currentSession.date}" onchange="load(this.value)"></label><h1 class="screen-title">Sesión ${sessionNo}</h1></div><nav class="nav-actions"><button class="ghost" onclick="go('history')">Hist</button><button class="ghost" onclick="go('settings')">Ajustes</button></nav></header><section class="hero"><div class="kicker">Volumen de hoy</div><div class="hero-number">${fmt(t.volume)} <small>KG</small></div><div class="compare"><span>HOY</span><div class="track"><div class="fill" style="width:${t.volume/max*100}%"></div></div><span></span></div><div class="compare"><span style="color:var(--muted)">ANTERIOR</span><div class="track"><div class="fill prev" style="width:${pt.volume/max*100}%"></div></div><span class="previous-value">${fmt(pt.volume)}</span></div><div class="hero-foot"><span>${pt.volume?(delta>=0?'Ya superaste la sesión anterior':`Te faltan ${fmt(pt.volume-t.volume)} kg para igualarla`):'Tu primera referencia empieza hoy'}</span><span class="delta">${pt.volume?(delta>=0?'+':'')+delta.toFixed(1)+'%':'—'}</span></div></section><div class="mini-grid">${[['TRABAJO',fmt(t.work),'J'],['POTENCIA',t.watts.toFixed(1),'W'],['INTENSIDAD',t.intensity.toFixed(1),'%']].map(x=>`<div class="mini"><span class="micro">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="plan-head"><span class="section-title">Plan de hoy</span><span class="section-title" style="color:var(--text)">${complete}/10</span></div><div class="segments">${segments()}</div><div class="exercise-list">${currentSession.exercises.map((ex,i)=>{const s=exStats(ex),c=currentSession.exerciseConfigs[ex.name],d=done(ex);return`<button class="exercise-row ${d?'done':''}" onclick="go('train',${i})"><span class="index">${i+1}</span><span class="row-copy"><span class="row-name">${esc(ex.name)}</span><span class="row-sub">${d?`${s.totalSets} series · ${s.totalReps} reps · ${fmt(s.volume)} kg`:`Pendiente · ${c.unit==='lbs'?'libras':'kilos'}`}</span></span>${isPR(ex)?'<span class="badge">RÉCORD</span>':''}<span class="chev">›</span></button>`}).join('')}</div></section><div class="sticky-cta"><button class="primary" onclick="startTraining()">${complete===0?'Empezar sesión':complete===10?'Revisar sesión':'Seguir entrenando'}</button></div>`}
function startTraining(){let i=currentSession.exercises.findIndex(ex=>!done(ex));go('train',i<0?0:i)}
function renderTrain(){const ex=currentSession.exercises[exerciseIndex],c=currentSession.exerciseConfigs[ex.name],s=exStats(ex),assisted=ASSISTED.includes(ex.name),step=c.unit==='lbs'?.5:.25;app.innerHTML=`<section class="screen train-screen" ontouchstart="touchStartX=event.changedTouches[0].clientX" ontouchend="handleSwipe(event)"><header class="train-top"><button class="ghost" onclick="go('session')">‹ Sesión</button><div class="segments">${segments(exerciseIndex)}</div><span class="position">${exerciseIndex+1} / 10</span></header><div class="exercise-heading"><h1>${esc(ex.name)}</h1>${isPR(ex)?'<span class="badge">RÉCORD</span>':''}</div><div class="chips"><button class="chip unit ${c.unit==='kg'?'active':''}" onclick="changeUnit('kg')">KG</button><button class="chip unit ${c.unit==='lbs'?'active':''}" onclick="changeUnit('lbs')">LIBRAS</button><span class="chip">ROM ${c.rom.toFixed(2)} M</span><span class="chip">${equipment(ex.name)}</span></div>${assisted?'<p class="assist">Registra la asistencia como número negativo. Se restará del peso corporal de Bruno.</p>':''}<div class="sets-head"><span></span><span>SERIES</span><span>REPS</span><span>${assisted?'ASIST.':'PESO'}</span><span></span></div><div>${ex.sets.length?ex.sets.map((set,i)=>`<div class="set-row"><span class="set-n">${i+1}</span><input class="set-input" type="number" inputmode="decimal" value="${set.sets||''}" oninput="updateSet(${i},'sets',this.value,false)" onchange="updateSet(${i},'sets',this.value,true)"><input class="set-input" type="number" inputmode="decimal" value="${set.reps||''}" oninput="updateSet(${i},'reps',this.value,false)" onchange="updateSet(${i},'reps',this.value,true)"><input class="set-input weight" type="number" inputmode="decimal" step="${step}" value="${set.weight||''}" oninput="updateSet(${i},'weight',this.value,false)" onchange="updateSet(${i},'weight',this.value,true)"><button class="remove" aria-label="Eliminar serie" onclick="removeSet(${i})">×</button></div>`).join(''):'<div class="empty">Aún sin series. Empieza fuerte.</div>'}</div><div class="set-actions"><button class="add" onclick="addSet()">+ Agregar serie</button><button class="repeat" onclick="repeatSet()">Repetir última</button></div><section class="metrics"><div class="metric-head"><span class="section-title">Intensidad</span><b>${s.intensity.toFixed(1)}%</b></div><div class="intensity-track"><div class="fill" style="width:${Math.min(100,s.intensity)}%"></div></div><div class="metric-grid">${[['VOLUMEN',fmt(s.volume)+' kg'],['TRABAJO',fmt(s.work)+' J'],['FUERZA',fmt(s.force)+' N']].map(x=>`<div><span class="micro">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><section class="parameters"><button onclick="parametersOpen=!parametersOpen;renderTrain()"><span>Parámetros del ejercicio</span><span>${parametersOpen?'−':'+'}</span></button>${parametersOpen?`<div class="param-panel"><div class="param-row"><span class="param-copy"><b>5RM</b><small>Base para el 1RM estimado</small></span><span><input class="param-input" type="number" inputmode="decimal" min="0" step="${step}" value="${c.fiveRM||''}" aria-label="5RM" oninput="updateConfig('fiveRM',this.value,false)" onchange="updateConfig('fiveRM',this.value,true)"> ${c.unit}</span></div><div class="param-row"><span class="param-copy"><b>ROM</b><small>Recorrido para trabajo y potencia</small></span><span><input class="param-input rom-edit" type="number" inputmode="decimal" min="0" step=".01" value="${c.rom}" aria-label="ROM en metros" oninput="updateConfig('rom',this.value,false)" onchange="updateConfig('rom',this.value,true)"> m</span></div><div class="param-row"><span class="param-copy"><b>1RM estimado</b><small>Fórmula de Brzycki</small></span><span class="one-rm">${s.oneRM.toFixed(1)} kg</span></div></div>`:''}</section></section><footer class="train-footer">${timer.seconds?`<div class="timer-on"><span class="micro">Descanso</span><span class="timer-label">${timerText()}</span><button onclick="toggleTimer()">${timer.running?'PAUSA':'SIGUE'}</button><button class="finish" onclick="stopTimer()">FIN</button></div>`:`<button class="timer-off" onclick="startTimer()">Iniciar descanso · ${timer.duration}s</button>`}<div class="train-nav"><button class="prev-btn" onclick="previousExercise()">‹</button><button class="primary" onclick="nextExercise()">${exerciseIndex===9?'Cerrar sesión':'Siguiente ejercicio'}</button></div></footer>`}
function updateSet(i,field,value,redraw=false){currentSession.exercises[exerciseIndex].sets[i][field]=Number(value)||0;save();if(redraw)renderTrain()}
function addSet(){currentSession.exercises[exerciseIndex].sets.push({sets:1,reps:5,weight:ASSISTED.includes(currentSession.exercises[exerciseIndex].name)?-20:0});save();renderTrain()}
function repeatSet(){const sets=currentSession.exercises[exerciseIndex].sets,last=sets[sets.length-1];sets.push(last?{...last}:{sets:1,reps:5,weight:ASSISTED.includes(currentSession.exercises[exerciseIndex].name)?-20:0});save();renderTrain()}
function removeSet(i){currentSession.exercises[exerciseIndex].sets.splice(i,1);save();renderTrain()}
function updateConfig(field,value,redraw=false){const parsed=Number(value);if(Number.isFinite(parsed)&&parsed>=0){currentSession.exerciseConfigs[currentSession.exercises[exerciseIndex].name][field]=parsed;save()}if(redraw)renderTrain()}
function changeUnit(next){const ex=currentSession.exercises[exerciseIndex],c=currentSession.exerciseConfigs[ex.name],old=c.unit;if(old===next)return;const factor=old==='kg'?1/LBS_TO_KG:LBS_TO_KG;c.fiveRM=Math.round((c.fiveRM||0)*factor*4)/4;ex.sets.forEach(s=>s.weight=Math.round((s.weight||0)*factor*4)/4);c.unit=next;save();renderTrain();toast(`Pesos convertidos a ${next}`)}
function nextExercise(){if(exerciseIndex===9)go('session');else{exerciseIndex++;parametersOpen=false;window.scrollTo(0,0);renderTrain()}}
function previousExercise(){if(exerciseIndex>0){exerciseIndex--;parametersOpen=false;window.scrollTo(0,0);renderTrain()}}
function handleSwipe(e){const delta=e.changedTouches[0].clientX-touchStartX;if(Math.abs(delta)<60)return;delta<0?nextExercise():previousExercise()}
function timerText(){return `${Math.floor(timer.seconds/60)}:${String(timer.seconds%60).padStart(2,'0')}`}
function startTimer(){timer.seconds=timer.duration;timer.running=true;timer.endAt=Date.now()+timer.seconds*1000;runTimer();renderTrain()}
function runTimer(){clearInterval(timerInterval);timerInterval=setInterval(tickTimer,250)}
function tickTimer(){if(!timer.running)return;timer.seconds=Math.max(0,Math.ceil((timer.endAt-Date.now())/1000));if(!timer.seconds){clearInterval(timerInterval);timer.running=false;if(navigator.vibrate)navigator.vibrate([150,80,150]);beep()}if(screen==='train')renderTrain()}
function toggleTimer(){if(timer.running){timer.seconds=Math.max(0,Math.ceil((timer.endAt-Date.now())/1000));timer.running=false;clearInterval(timerInterval)}else{timer.running=true;timer.endAt=Date.now()+timer.seconds*1000;runTimer()}renderTrain()}
function stopTimer(){clearInterval(timerInterval);timer={...timer,seconds:0,running:false,endAt:0};renderTrain()}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.08;o.frequency.value=880;o.start();o.stop(c.currentTime+.18)}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timer.running)tickTimer()});
function renderHistory(){const all=sessions();app.innerHTML=`<section class="screen"><header class="sheet-title"><h1>Historial</h1><button class="ghost" onclick="go('session')">Cerrar</button></header><p style="color:var(--muted);font-size:13px">Consulta una sesión o elimina registros que ya no necesites.</p><div class="session-list">${all.length?all.map(raw=>{const s=normalize(raw),t=totals(s),setCount=s.exercises.reduce((n,e)=>n+e.sets.reduce((a,x)=>a+(Number(x.sets)||0),0),0),prs=s.exercises.some(ex=>isPR(ex,s));return`<article class="history-card"><button class="history-open" onclick="openHistory('${s.date}')"><b>${dateLabel(s.date)}</b><small>${s.exercises.filter(done).length} ejercicios · ${setCount} series · ${Number(s.bodyweight).toFixed(1)} kg corporal</small></button>${prs?'<span class="badge">PR</span>':''}<div><div class="history-volume">${fmt(t.volume)}<small>KG</small></div><button class="delete" aria-label="Eliminar sesión" onclick="deleteSession('${s.date}')">×</button></div></article>`}).join(''):'<div class="empty-state">Aún no hay sesiones guardadas.</div>'}</div></section>`}
function openHistory(date){load(date);screen='session';render()}
function deleteSession(date){if(!confirm('¿Eliminar esta sesión? Esta acción no se puede deshacer.'))return;const all=sessions().filter(s=>s.date!==date);localStorage.setItem(STORAGE_KEY,JSON.stringify(all));if(currentSession.date===date)currentSession=blankSession(today());renderHistory();toast('Sesión eliminada')}
function renderSettings(){app.innerHTML=`<section class="screen"><header class="sheet-title"><h1>Ajustes</h1><button class="ghost" onclick="go('session')">Cerrar</button></header><div class="settings-card"><label class="setting-row"><span class="setting-copy"><b>Peso corporal</b><small>Solo para seguimiento histórico</small></span><span><input class="setting-input" type="number" inputmode="decimal" step=".1" value="${currentSession.bodyweight}" onchange="updateSetting('bodyweight',this.value)"> kg</span></label><label class="setting-row"><span class="setting-copy"><b>Duración</b><small>Para calcular la potencia</small></span><span><input class="setting-input" type="number" inputmode="numeric" value="${currentSession.workoutTime}" onchange="updateSetting('workoutTime',this.value)"> min</span></label><label class="setting-row"><span class="setting-copy"><b>Descanso</b><small>Entre 30 y 240 segundos</small></span><span><input class="setting-input" type="number" inputmode="numeric" min="30" max="240" step="15" value="${timer.duration}" onchange="setRest(this.value)"> s</span></label></div><div class="settings-actions"><button class="secondary" onclick="copyPrevious()">Copiar entrenamiento anterior</button><div class="split"><button class="secondary" onclick="exportData()">Exportar</button><button class="secondary" onclick="importFile.click()">Importar</button></div></div><div class="credit">Desarrollado por Luis Cárdenas · Storm Studios<br><a href="https://www.stormstudios.com.mx" target="_blank" rel="noopener">www.stormstudios.com.mx</a></div></section>`}
function updateSetting(field,value){currentSession[field]=Number(value)||(field==='bodyweight'?79.2:60);save();renderSettings()}
function setRest(value){timer.duration=Math.min(240,Math.max(30,Math.round((Number(value)||90)/15)*15));localStorage.setItem('workoutRestBruno',timer.duration);renderSettings();toast('Descanso actualizado')}
function copyPrevious(){const past=sessions().filter(s=>s.date<currentSession.date).sort((a,b)=>b.date.localeCompare(a.date));if(!past.length){toast('No hay entrenamientos anteriores');return}for(const ex of currentSession.exercises){const source=past.map(normalize).find(s=>{const e=s.exercises.find(x=>x.name===ex.name);return e&&e.sets.length});if(source){const old=source.exercises.find(x=>x.name===ex.name);ex.sets=old.sets.map(x=>({...x}));currentSession.exerciseConfigs[ex.name]={...source.exerciseConfigs[ex.name]}}}currentSession.bodyweight=normalize(past[0]).bodyweight;save();renderSettings();toast('Entrenamiento anterior copiado')}
function exportData(){const blob=new Blob([JSON.stringify(sessions(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`entrenamiento_bruno_${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Datos exportados')}
importFile.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data))throw Error();localStorage.setItem(STORAGE_KEY,JSON.stringify(data));load(currentSession.date);toast('Datos importados')}catch{toast('El archivo no contiene datos válidos')}};reader.readAsText(file);e.target.value=''})
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
timer.duration=Number(localStorage.getItem('workoutRestBruno'))||90;setInterval(()=>save(false),30000);load();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
